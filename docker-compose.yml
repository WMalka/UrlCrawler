# Full local stack: docker compose up --build   (copy .env.example to .env first)
name: alteva-crawler

x-crawler-env: &crawler-env
  ConnectionStrings__Crawler: "Server=sqlserver,1433;Database=Crawler;User Id=sa;Password=${SA_PASSWORD:?set SA_PASSWORD in .env};TrustServerCertificate=true"
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      args:
        PROJECT: Crawler.Api
    environment:
      <<: *crawler-env
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  worker:
    build:
      context: .
      args:
        PROJECT: Crawler.Worker
    environment:
      <<: *crawler-env
    deploy:
      replicas: 2
    depends_on:
      api: # the API applies the database migrations
        condition: service_healthy
    healthcheck: *dotnet-healthcheck

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver-data:
  rabbitmq-data:
